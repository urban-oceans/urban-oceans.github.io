<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Urban Oceans Library</title>
<style>
body{
font-family:Arial,Helvetica,sans-serif;
margin:0;
background:#f5f7fa;
color:#222;
}
header{
background:#0b3d62;
color:white;
padding:14px 20px;
}
h1{
margin:0;
font-size:24px;
}
.container{
padding:15px;
max-width:1400px;
margin:auto;
}
.controls{
background:white;
padding:12px;
border-radius:8px;
margin-bottom:12px;
box-shadow:0 1px 4px #ccc;
}
input,select,button{
padding:7px;
margin:3px;
border:1px solid #bbb;
border-radius:4px;
}
button{
cursor:pointer;
background:#0b3d62;
color:white;
}
button:hover{
background:#145987;
}
.tabs{
display:flex;
flex-wrap:wrap;
gap:5px;
margin-top:8px;
}
.tab{
background:#e5edf5;
color:#123;
padding:5px 9px;
border-radius:12px;
cursor:pointer;
font-size:13px;
}
.tab.active{
background:#0b3d62;
color:white;
}
.card{
background:white;
padding:10px;
margin-bottom:8px;
border-radius:7px;
box-shadow:0 1px 3px #ccc;
}
.citation-row{
display:flex;
gap:10px;
}
.number{
font-weight:bold;
width:35px;
color:#0b3d62;
}
.citation{
flex:1;
}
.title{
font-weight:bold;
font-size:16px;
margin-bottom:4px;
}
.authors,.journal{
font-size:13px;
color:#555;
}
.links a{
margin-right:10px;
font-size:13px;
color:#0b3d62;
}
.expand{
margin-top:5px;
font-size:12px;
padding:4px 8px;
}
.abstract{
margin-top:8px;
padding:8px;
background:#f1f5f8;
border-radius:5px;
font-size:14px;
line-height:1.4;
}
.hidden{
display:none;
}
.tag{
display:inline-block;
background:#d9edf7;
padding:3px 7px;
margin:3px;
border-radius:10px;
font-size:12px;
}
.count{
font-size:12px;
opacity:.8;
}
.error{
background:#fff3cd;
border:1px solid #ffeeba;
padding:10px;
border-radius:6px;
margin-bottom:10px;
}
.small{
font-size:13px;
color:#666;
}
</style>
</head>
<body>

<header>
<h1>Urban Oceans Literature Library</h1>
</header>

<div class="container">

<div class="controls">

<input id="jsonFile" type="file" accept=".json">
<input id="csvFile" type="file" accept=".csv">

<br>

<input id="search" placeholder="Search title or author">

<select id="yearFilter">
<option value="">All years</option>
</select>

<select id="sort">
<option value="title">Sort: Title A-Z</option>
<option value="year">Sort: Year</option>
<option value="author">Sort: Author</option>
</select>

<div id="tabs" class="tabs"></div>

</div>

<div id="errors"></div>

<div id="stats" class="small"></div>

<div id="library"></div>

</div>

<script>
let publications=[];
let original=[];
let tagData={};
let activeFilter="";
let searchText="";
let selectedYear="";
let sortMode="title";
let csvTags=[];

function normalizeTitle(title){
return (title||"")
.toLowerCase()
.replace(/~/g,":")
.replace(/^\s*\d+\s*:\s*/,"")
.replace(/[:;,.()[\]{}]/g," ")
.replace(/[^a-z0-9\s]/g," ")
.replace(/\s+/g," ")
.trim();
}

function cleanHeader(header){
let h=(header||"").trim();
if(h.includes(":")){
h=h.split(":").slice(1).join(":").trim();
}
return h;
}

function cleanCSVTitle(title){
return normalizeTitle(title);
}

function titleSimilarity(a,b){
let wordsA=new Set(normalizeTitle(a).split(" "));
let wordsB=new Set(normalizeTitle(b).split(" "));
let common=0;
wordsA.forEach(w=>{
if(wordsB.has(w)&&w.length>2)common++;
});
return common/Math.max(wordsA.size,wordsB.size);
}

function parseCSV(csv){

let rows=csv.trim().split(/\r?\n/);

let headers=rows[0]
.split(",")
.map(cleanHeader);

csvTags=headers.slice(1);

let records={};

for(let i=1;i<rows.length;i++){

let values=rows[i].split(",");

let title=cleanCSVTitle(values[0]);

if(!title)continue;

records[title]={};

for(let j=1;j<headers.length;j++){

if((values[j]||"").trim()=="1"){

records[title][headers[j]]=true;

}

}

}

return records;

}

function applyTags(){

let missing=[];
let matched=0;

publications.forEach(item=>{

let zoteroTitle=normalizeTitle(item.title);

let best=null;
let score=0;

Object.keys(tagData).forEach(csvTitle=>{

let s=titleSimilarity(
zoteroTitle,
csvTitle
);

if(s>score){
score=s;
best=csvTitle;
}

});


if(score<0.45){

missing.push(item.title);
return;

}


matched++;

item.keyword=item.keyword||[];

Object.keys(tagData[best]).forEach(tag=>{

if(!item.keyword.includes(tag)){
item.keyword.push(tag);
}

});

});


window.missingArticles=missing;

document.getElementById("errors").innerHTML=
missing.length?
`
<div class="error">
<b>⚠️ Unmatched articles: ${missing.length}</b>
<br>
These Zotero articles did not match the CSV:
<ul>
${missing.map(x=>`<li>${x}</li>`).join("")}
</ul>
</div>
`
:"";


console.log("Matched:",matched);
console.log("Missing:",missing.length);

createTabs();
populateYears();
update();

}

document.getElementById("jsonFile").addEventListener(
"change",
function(e){

let file=e.target.files[0];

if(!file)return;

let reader=new FileReader();

reader.onload=function(){

publications=JSON.parse(reader.result);

original=[...publications];

if(Object.keys(tagData).length){
applyTags();
}else{
createTabs();
populateYears();
update();
}

};

reader.readAsText(file);

});


document.getElementById("csvFile")
.addEventListener(
"change",
function(e){

let file=e.target.files[0];

if(!file)return;

let reader=new FileReader();

reader.onload=function(){

tagData=parseCSV(reader.result);

if(publications.length){
applyTags();
}

};

reader.readAsText(file);

});

function getYear(item){
return item.issued?.["date-parts"]?.[0]?.[0]||"";
}

function getAuthor(item){
if(!item.author)return"";
return item.author.map(a=>
a.family||a.literal||""
).join(", ");
}

function getType(item){

let types={
"article-journal":"Journal Article",
"article":"Article",
"book":"Book",
"chapter":"Book Chapter",
"report":"Report",
"thesis":"Thesis",
"paper-conference":"Conference"
};

return types[item.type]||"Other";

}


function createTabs(){

let container=document.getElementById("tabs");

container.innerHTML="";

let filters={
"All":publications
};


publications.forEach(item=>{

let type=getType(item);

if(!filters[type]){
filters[type]=[];
}

filters[type].push(item);


if(item.keyword){

item.keyword.forEach(tag=>{

if(!filters[tag]){
filters[tag]=[];
}

filters[tag].push(item);

});

}

});


Object.keys(filters)
.sort()
.forEach(name=>{

let button=document.createElement("div");

button.className="tab";

button.innerHTML=
`${name} <span class="count">(${filters[name].length})</span>`;

button.onclick=function(){

activeFilter=name;

document.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

update();

};


container.appendChild(button);


if(name==="All"){
button.classList.add("active");
}

});

}


function populateYears(){

let select=document.getElementById("yearFilter");

let years=[
...new Set(
publications
.map(getYear)
.filter(x=>x)
)
]
.sort((a,b)=>b-a);


years.forEach(year=>{

let option=document.createElement("option");

option.value=year;

option.textContent=year;

select.appendChild(option);

});

}


document.getElementById("search")
.addEventListener(
"input",
function(e){

searchText=e.target.value.toLowerCase();

update();

});


document.getElementById("yearFilter")
.addEventListener(
"change",
function(e){

selectedYear=e.target.value;

update();

});


document.getElementById("sort")
.addEventListener(
"change",
function(e){

sortMode=e.target.value;

update();

});


function sortItems(items){

if(sortMode==="year"){

return items.sort((a,b)=>
getYear(b)-getYear(a)
);

}


if(sortMode==="author"){

return items.sort((a,b)=>
getAuthor(a).localeCompare(
getAuthor(b)
)
);

}


return items.sort((a,b)=>
(a.title||"").localeCompare(
b.title||"",
undefined,
{sensitivity:"base"}
)
);

}


function update(){

let results=[...publications];


if(activeFilter&&activeFilter!=="All"){

results=results.filter(item=>

getType(item)===activeFilter ||

(item.keyword&&
item.keyword.includes(activeFilter))

);

}


if(selectedYear){

results=results.filter(item=>
String(getYear(item))===selectedYear
);

}


if(searchText){

results=results.filter(item=>{

let title=(item.title||"")
.toLowerCase();

let author=getAuthor(item)
.toLowerCase();

return title.includes(searchText)||
author.includes(searchText);

});

}


results=sortItems(results);


results.forEach((item,index)=>{

item.index=index+1;

});


display(results);


document.getElementById("stats")
.innerHTML=
`Showing ${results.length} of ${publications.length} articles`;

}

  function display(items){

let library=document.getElementById("library");

library.innerHTML="";


if(items.length===0){

library.innerHTML="<p>No articles found.</p>";

return;

}


items.forEach(item=>{


let authors=getAuthor(item);

let year=getYear(item);


let links="";


if(item.DOI){

links+=`
<a href="https://doi.org/${item.DOI}" target="_blank">
DOI
</a>
`;

}


if(item.URL){

links+=`
<a href="${item.URL}" target="_blank">
Link
</a>
`;

}


let tags="";


if(item.keyword){

tags=item.keyword.map(tag=>

`<span class="tag">${tag}</span>`

).join("");

}


let abstract=item.abstract||
"No abstract available.";


let card=document.createElement("div");

card.className="card";


card.innerHTML=`

<div class="citation-row">

<div class="number">
${String(item.index).padStart(3,"0")}
</div>

<div class="citation">

<div class="title">
${item.title||"Untitled"}
</div>


<div class="authors">
${authors}
</div>


<div class="journal">
${item["container-title"]||""}
${year?" | "+year:""}
</div>


<div class="links">
${links}
</div>


<button class="expand" onclick="toggleAbstract(this)">
▼ Show Abstract
</button>


<div class="abstract hidden">
${abstract}
</div>


<div>
${tags}
</div>


</div>

</div>

`;

library.appendChild(card);


});


}


function toggleAbstract(button){

let box=
button.nextElementSibling;


if(box.classList.contains("hidden")){

box.classList.remove("hidden");

button.textContent=
"▲ Hide Abstract";

}else{

box.classList.add("hidden");

button.textContent=
"▼ Show Abstract";

}

}
</script>

</body>
</html>
