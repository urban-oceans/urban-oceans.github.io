<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Urban Oceans Library</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f7f9;
    color:#333;
}


header{

    background:#064663;
    color:white;
    text-align:center;
    padding:40px 20px;

}


header h1{

    margin:0;
    font-size:42px;

}


header p{

    margin-top:10px;
    opacity:.85;

}


/* Tabs */

#tabs{

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:25px;

}


.tab{

    border:none;
    background:#dbeaf2;
    color:#064663;
    padding:10px 18px;
    border-radius:25px;
    cursor:pointer;
    font-size:15px;

}


.tab:hover,
.tab.active{

    background:#064663;
    color:white;

}



/* Publications */

#library{

    max-width:1100px;
    margin:auto;
    padding:20px;

}


.card{

    background:white;
    border-radius:12px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);

}


.type{

    display:inline-block;
    background:#064663;
    color:white;
    padding:5px 12px;
    border-radius:20px;
    font-size:13px;
    margin-bottom:15px;

}


.title{

    color:#064663;
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;

}


.meta{

    color:#666;
    line-height:1.6;

}


.abstract{

    margin-top:18px;
    line-height:1.7;

}


.tags{

    margin-top:20px;

}


.tag{

    display:inline-block;
    background:#e1f1f7;
    color:#064663;
    padding:5px 10px;
    border-radius:15px;
    margin:3px;
    font-size:12px;

}


.links{

    margin-top:20px;

}


.links a{

    background:#064663;
    color:white;
    text-decoration:none;
    padding:8px 14px;
    border-radius:6px;
    margin-right:8px;

}



footer{

    text-align:center;
    padding:40px;
    color:#777;

}


</style>

</head>


<body>


<header>

<h1>🌊 Urban Oceans Library</h1>

<p>Zotero Research Collection</p>

</header>



<div id="tabs"></div>


<main id="library">

Loading publications...

</main>



<footer>

Generated from Zotero JSON

</footer>




<script>


let items=[];


const library=document.getElementById("library");

const tabs=document.getElementById("tabs");



fetch("Urban Oceans final 2025.json")


.then(response=>response.json())


.then(data=>{


    items=data;


    // newest first

    items.sort((a,b)=>{

        let yearA=parseInt(a.date)||0;

        let yearB=parseInt(b.date)||0;

        return yearB-yearA;

    });



    createTabs();


    display(items);


})


.catch(error=>{

    library.innerHTML=
    "<h2>Unable to load Zotero JSON file.</h2>";

    console.error(error);

});






function createTabs(){


    tabs.innerHTML="";


    let counts={};


    items.forEach(item=>{


        let type=item.itemType || "Other";


        counts[type]=(counts[type]||0)+1;


    });




    addTab(
        "All",
        items.length,
        items
    );



    Object.keys(counts)
    .sort()
    .forEach(type=>{


        addTab(
            type,
            counts[type],
            items.filter(item=>item.itemType===type)
        );


    });



}




function addTab(name,count,data){


    let button=document.createElement("button");


    button.className="tab";


    button.textContent=
    `${name} (${count})`;



    button.onclick=function(){


        document
        .querySelectorAll(".tab")
        .forEach(tab=>tab.classList.remove("active"));



        button.classList.add("active");


        display(data);


    };



    tabs.appendChild(button);



    if(name==="All"){

        button.classList.add("active");

    }


}





function display(publications){


    library.innerHTML="";



    publications.forEach(item=>{


        let authors=(item.creators||[])

        .map(author=>{

            return `${author.firstName || ""}
            ${author.lastName || ""}`.trim();

        })

        .join(", ");




        let tags=(item.tags||[])

        .map(tag=>{

            return `<span class="tag">
            ${tag.tag}
            </span>`;

        })

        .join("");




        let links="";


        if(item.url){

            links+=`
            <a href="${item.url}" target="_blank">
            Website
            </a>`;

        }



        if(item.DOI){

            links+=`
            <a href="https://doi.org/${item.DOI}" target="_blank">
            DOI
            </a>`;

        }




        let card=document.createElement("div");


        card.className="card";



        card.innerHTML=`

        <div class="type">
        ${item.itemType || "Other"}
        </div>


        <div class="title">
        ${item.title || "Untitled"}
        </div>


        <div class="meta">

        ${authors}

        <br>

        ${item.publicationTitle || ""}

        <br>

        ${item.publisher || ""}

        <br>

        ${item.date || ""}

        </div>



        <div class="abstract">

        ${item.abstractNote || "No abstract available."}

        </div>



        <div class="tags">

        ${tags}

        </div>



        <div class="links">

        ${links}

        </div>


        `;
        library.appendChild(card);

    });


}



</script>


</body>

</html>
