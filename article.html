<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Urban Oceans Library</title>

<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;
    font-family:
    "Helvetica Neue",
    Arial,
    sans-serif;

    background:#f3f7f8;
    color:#333;

}



/* Header */

header{

    background:
    linear-gradient(
        135deg,
        #003b4d,
        #007c91
    );

    color:white;

    padding:50px 20px;

    text-align:center;

}


header h1{

    font-size:42px;
    margin:0;

}


header p{

    font-size:18px;
    opacity:.85;

}



/* Tabs */


#tabs{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:10px;

    padding:30px;

}



.tab{

    border:none;

    background:#d9edf2;

    color:#003b4d;

    padding:10px 18px;

    border-radius:30px;

    cursor:pointer;

    font-size:15px;

}



.tab:hover,
.tab.active{

    background:#003b4d;

    color:white;

}




/* Library */


#library{

    max-width:1100px;

    margin:auto;

    padding:20px;

}



.card{

    background:white;

    margin-bottom:25px;

    padding:30px;

    border-radius:15px;

    box-shadow:
    0 5px 20px rgba(0,0,0,.08);

}



.type{

    display:inline-block;

    background:#007c91;

    color:white;

    padding:5px 12px;

    border-radius:20px;

    font-size:13px;

}



.title{

    margin-top:15px;

    font-size:24px;

    font-weight:bold;

    color:#003b4d;

}



.authors{

    margin-top:12px;

    color:#555;

}



.journal{

    margin-top:8px;

    font-style:italic;

    color:#666;

}



.abstract{

    margin-top:20px;

    line-height:1.7;

}



.tags{

    margin-top:20px;

}



.tag{

    display:inline-block;

    background:#e3f3f7;

    color:#00576b;

    padding:6px 12px;

    border-radius:20px;

    margin:3px;

    font-size:12px;

}



.links{

    margin-top:25px;

}



.links a{

    background:#003b4d;

    color:white;

    padding:9px 15px;

    border-radius:6px;

    text-decoration:none;

    margin-right:8px;

}



.links a:hover{

    background:#007c91;

}



footer{

    text-align:center;

    padding:40px;

    color:#777;

}



</style>

</head>



<body>


<header>

<h1>🌊 Urban Oceans Library</h1>

<p>Research collection powered by Zotero</p>

</header>



<div id="tabs"></div>


<main id="library">

Loading publications...

</main>



<footer>

Urban Oceans Research Library

</footer>





<script>


let publications=[];


const library =
document.getElementById("library");


const tabs =
document.getElementById("tabs");





fetch("Urban Oceans 2025.json")


.then(response=>response.json())


.then(data=>{


    publications=data;


    publications.sort((a,b)=>{

        return getYear(b)-getYear(a);

    });


    createTabs();


    display(publications);


})

.catch(error=>{

    library.innerHTML=
    "<h2>Could not load CSL JSON file.</h2>";

    console.error(error);

});







function getYear(item){

    return Number(
        item.issued
        ?.["date-parts"]
        ?. [0]
        ?. [0]
    ) || 0;

}





function getType(item){


    const names={

        "article-journal":
        "Journal Article",

        "article-magazine":
        "Magazine Article",

        "article-newspaper":
        "Newspaper Article",

        "book":
        "Book",

        "chapter":
        "Book Chapter",

        "report":
        "Report",

        "thesis":
        "Thesis",

        "paper-conference":
        "Conference Paper",

        "webpage":
        "Web Page"

    };


    return names[item.type] || "Other";

}





function createTabs(){


    tabs.innerHTML="";


    let counts={};


    publications.forEach(item=>{


        let type=getType(item);


        counts[type]=
        (counts[type]||0)+1;


    });



    addTab(
        "All",
        publications
    );



    Object.keys(counts)

    .sort()

    .forEach(type=>{


        addTab(

            type,

            publications.filter(
                item=>getType(item)===type
            )

        );


    });


}






function addTab(name,data){


    let button =
    document.createElement("button");


    button.className="tab";


    button.textContent =
    `${name} (${data.length})`;



    button.onclick=function(){


        document
        .querySelectorAll(".tab")
        .forEach(b=>
            b.classList.remove("active")
        );


        button.classList.add("active");


        display(data);


    };



    tabs.appendChild(button);



    if(name==="All"){

        button.classList.add("active");

    }

}





function display(items){


    library.innerHTML="";



    items.forEach(item=>{


        let authors =
        (item.author || [])

        .map(a=>{


            if(a.literal){

                return a.literal;

            }


            return `${a.given || ""}
            ${a.family || ""}`.trim();


        })

        .join(", ");





        let keywords="";


        if(item.keyword){


            keywords =
            item.keyword

            .map(k=>

                `<span class="tag">
                ${k}
                </span>`

            )

            .join("");

        }




        let links="";



        if(item.URL){

            links +=

            `<a href="${item.URL}"
            target="_blank">
            Link
            </a>`;

        }



        if(item.DOI){


            links +=

            `<a href="https://doi.org/${item.DOI}"
            target="_blank">
            DOI
            </a>`;

        }






        let card =
        document.createElement("div");


        card.className="card";



        card.innerHTML=`

        <div class="type">

        ${getType(item)}

        </div>



        <div class="title">

        ${item.title || "Untitled"}

        </div>



        <div class="authors">

        ${authors}

        </div>



        <div class="journal">

        ${item["container-title"] || ""}

        ${getYear(item)}

        </div>



        <div class="abstract">

        ${
            item.abstract ||
            "No abstract available."
        }

        </div>



        <div class="tags">

        ${keywords}

        </div>



        <div class="links">

        ${links}

        </div>


        `;



        library.appendChild(card);



    });


}




</script>


</body>

</html>
