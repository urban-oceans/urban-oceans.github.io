<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Zotero Quality Matcher</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f7f8;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.title{
    font-size:18px;
    font-weight:bold;
    color:#003b4d;
}

.authors{
    margin-top:4px;
    color:#666;
}

.quality{
    margin-top:8px;
    display:inline-block;
    padding:4px 10px;
    border-radius:15px;
    background:#007c91;
    color:white;
    font-size:12px;
}

.unmatched{
    background:#fff3cd;
    border:1px solid #ffeeba;
    padding:15px;
    border-radius:8px;
    margin-bottom:25px;
}

</style>

</head>

<body>

<h1>Zotero Quality Assessment Library</h1>

<div id="report"></div>

<div id="library">
Loading...
</div>

<script>

let publications = [];
let qualityLookup = {};

function cleanTitle(title){

    return title
        .toLowerCase()
        .replace(/^\d+\s*:\s*/,'')
        .replace(/~/g,':')
        .replace(/[.,;!?]/g,'')
        .replace(/\s+/g,' ')
        .trim();
}

Promise.all([
    fetch("Urban-Oceans-2025.json").then(r=>r.json()),
    fetch("quality.csv").then(r=>r.text())
])

.then(([jsonData,csvText])=>{

    publications = jsonData;

    parseCSV(csvText);

    applyQuality();

    displayLibrary();

})

.catch(err=>{

    document.getElementById("library").innerHTML =
    "<h2>Error loading files.</h2>";

    console.error(err);

});


function parseCSV(csvText){

    const rows = csvText
        .trim()
        .split(/\r?\n/);

    const unmatched = [];

    rows.slice(1).forEach(row=>{

        const cols =
            row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)
            ?.map(v=>v.replace(/^"|"$/g,'').trim());

        if(!cols || cols.length < 3) return;

        const title = cols[1];
        const quality = cols[2];

        qualityLookup[cleanTitle(title)] = quality;

    });

}


function applyQuality(){

    let matchCount = 0;

    publications.forEach(item=>{

        const key =
            cleanTitle(item.title || '');

        if(qualityLookup[key]){

            item.quality =
                qualityLookup[key];

            matchCount++;
        }
        else{

            item.quality =
                "Not Assessed";
        }

    });

    report.innerHTML =
        `<div class="unmatched">
        <strong>Matches:</strong> ${matchCount}
        </div>`;
}


function displayLibrary(){

    const library =
        document.getElementById("library");

    library.innerHTML = "";

    publications.forEach(item=>{

        const authors =
            (item.author||[])
            .map(a=>
                a.literal ||
                `${a.given||''} ${a.family||''}`.trim()
            )
            .join(", ");

        const year =
            item.issued?.["date-parts"]?.[0]?.[0] || '';

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="title">
                ${item.title || "Untitled"}
            </div>

            <div class="authors">
                ${authors}
            </div>

            <div>
                ${item["container-title"] || ""}
                ${year ? " | " + year : ""}
            </div>

            <div class="quality">
                Quality: ${item.quality}
            </div>

        `;

        library.appendChild(card);

    });

}

</script>

</body>
</html>
