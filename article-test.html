<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metro Vancouver Urban Oceans Literature Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f3f7f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Primary palette matching design */
    .bg-header {
      background-color: #00667e;
    }
    .text-title-teal {
      color: #0c4a5c;
    }
    .text-index-teal {
      color: #0a6b7d;
    }
    .border-pill-teal {
      border-color: #007a93;
    }
    
    /* Pill button active state */
    .pill-active {
      background-color: #0f3842;
      color: #ffffff;
    }
    .pill-inactive {
      background-color: #e0f2f1;
      color: #0f3842;
    }
    .pill-inactive:hover {
      background-color: #ccece9;
    }

    /* Tag badge styling */
    .tag-badge {
      background-color: #e0f2f1;
      color: #0b5061;
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-right: 6px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    /* Custom focus states */
    input:focus, select:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 102, 126, 0.25);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header Section -->
  <header class="bg-header text-white py-8 px-4 text-center shadow-md relative">
    <div class="max-w-7xl mx-auto flex flex-col items-center justify-center">
      <div class="flex items-center gap-3 mb-1">
        <!-- Wave Logo Icon -->
        <span class="text-4xl leading-none select-none">🌊</span>
        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">Urban Oceans Library</h1>
      </div>
      <p class="text-teal-100 text-sm sm:text-base font-normal">Metro Vancouver Urban Oceans Literature Library</p>
    </div>
  </header>

  <!-- Main App Layout (Sidebar + Content) -->
  <div class="max-w-7xl w-full mx-auto px-4 py-8 flex-1 flex flex-col lg:flex-row gap-8 items-start">

    <!-- Left Sidebar: Tags Filter Panel -->
    <aside class="w-full lg:w-80 bg-white rounded-2xl p-6 shadow-sm border border-gray-100 lg:sticky lg:top-8 flex flex-col max-h-[calc(100vh-4rem)]">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-gray-100">
        <h2 class="font-bold text-lg text-title-teal flex items-center gap-2">
          <span>🏷️</span> Filter by Tags
        </h2>
        <span id="selectedTagCountBadge" class="text-xs bg-teal-50 text-teal-800 font-semibold px-2 py-0.5 rounded-full border border-teal-200">0 selected</span>
      </div>

      <!-- Tag Action Buttons -->
      <div class="flex gap-2 mb-4 text-xs">
        <button onclick="selectAllTags()" class="flex-1 bg-teal-50 hover:bg-teal-100 text-teal-800 font-medium py-1.5 px-3 rounded-lg transition border border-teal-200">
          Select All
        </button>
        <button onclick="deselectAllTags()" class="flex-1 bg-gray-50 hover:bg-gray-100 text-gray-700 font-medium py-1.5 px-3 rounded-lg transition border border-gray-200">
          Deselect All
        </button>
      </div>

      <!-- Tag Search Filter inside Sidebar -->
      <div class="mb-3">
        <input 
          type="text" 
          id="tagSearchInput" 
          oninput="renderTagSidebar()" 
          placeholder="Search tags..." 
          class="w-full px-3 py-1.5 text-xs rounded-lg border border-gray-200 bg-gray-50 text-gray-800 placeholder-gray-400 focus:bg-white transition"
        >
      </div>

      <!-- Scrollable Checkbox List -->
      <div id="tagCheckboxesContainer" class="overflow-y-auto flex-1 space-y-2 pr-1 text-sm">
        <!-- Rendered dynamically -->
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 w-full min-w-0">

      <!-- Unmatched Titles Audit Report -->
      <section id="auditReportContainer" class="mb-6 hidden">
        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-5 text-amber-900 shadow-sm">
          <details class="group">
            <summary class="font-bold text-sm sm:text-base cursor-pointer flex items-center justify-between select-none">
              <span class="flex items-center gap-2">
                ⚠️ <span id="auditSummaryText">Matching Report: Unmatched Items Found</span>
              </span>
              <span class="text-xs bg-amber-200/80 px-2.5 py-1 rounded-full text-amber-900 group-open:rotate-180 transition-transform duration-200">▼</span>
            </summary>
            <div class="mt-4 pt-4 border-t border-amber-200/80 text-xs sm:text-sm flex flex-col gap-4">
              <div>
                <p class="font-semibold text-amber-950 mb-1">CSV Titles without JSON Match (<span id="unmatchedCsvCount">0</span>):</p>
                <ul id="unmatchedCsvList" class="list-disc pl-5 max-h-40 overflow-y-auto space-y-1 bg-white/60 p-2 rounded border border-amber-200/50"></ul>
              </div>
              <div>
                <p class="font-semibold text-amber-950 mb-1">JSON Titles without CSV Match (<span id="unmatchedJsonCount">0</span>):</p>
                <ul id="unmatchedJsonList" class="list-disc pl-5 max-h-40 overflow-y-auto space-y-1 bg-white/60 p-2 rounded border border-amber-200/50"></ul>
              </div>
            </div>
          </details>
        </div>
      </section>

      <!-- Search and Controls -->
      <section class="flex flex-col items-center gap-4 mb-8">
        
        <!-- Search Input -->
        <div class="w-full max-w-xl">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search by title or author..." 
            oninput="handleFilterAndSort()"
            class="w-full px-5 py-2.5 rounded-full border-2 border-pill-teal bg-white text-gray-800 placeholder-gray-400 text-center sm:text-left text-base shadow-sm transition"
          >
        </div>

        <!-- Year Filter Dropdown -->
        <div class="w-auto">
          <select 
            id="yearFilter" 
            onchange="handleFilterAndSort()" 
            class="px-5 py-1.5 rounded-full border border-teal-600 bg-white text-gray-800 font-medium text-sm shadow-sm cursor-pointer"
          >
            <option value="ALL">All Years</option>
          </select>
        </div>

        <!-- Item Type Pills -->
        <div id="itemTypePills" class="flex flex-wrap justify-center gap-2 max-w-4xl text-sm mt-1">
          <!-- Rendered dynamically -->
        </div>

        <!-- Sorting Controls -->
        <div class="flex flex-wrap justify-center gap-2 text-sm mt-2">
          <button 
            id="sortTitle" 
            onclick="setSort('title')" 
            class="px-4 py-1.5 rounded-full font-medium transition pill-active"
          >
            Title A–Z
          </button>
          <button 
            id="sortYear" 
            onclick="setSort('year')" 
            class="px-4 py-1.5 rounded-full font-medium transition pill-inactive"
          >
            Newest Year
          </button>
          <button 
            id="sortAuthor" 
            onclick="setSort('author')" 
            class="px-4 py-1.5 rounded-full font-medium transition pill-inactive"
          >
            Author A–Z
          </button>
        </div>

      </section>

      <!-- Articles List Container -->
      <section id="articlesContainer" class="flex flex-col gap-6">
        <!-- Article Cards will be injected here -->
      </section>

    </main>

  </div>

  <script>
    // State Variables
    let processedItems = [];
    let allAvailableTags = [];
    let selectedTags = new Set(); // Stores checked tags
    let selectedItemType = 'ALL';
    let selectedYear = 'ALL';
    let currentSort = 'title'; // 'title' | 'year' | 'author'
    let expandedAbstracts = new Set();

    // Map CSL types to User-Friendly Display Names
    const typeMapping = {
      'book': 'Book',
      'chapter': 'Book Chapter',
      'paper-conference': 'Conference Paper',
      'article-journal': 'Journal Article',
      'article-newspaper': 'Newspaper Article',
      'report': 'Report',
      'webpage': 'Web Page',
      'post-weblog': 'Web Page',
      'other': 'Other'
    };

    // Load JSON file and CSV file on startup
    window.onload = function() {
      Promise.all([
        fetch('Urban Oceans final 2025.json').then(res => {
          if (!res.ok) throw new Error(`JSON status: ${res.status}`);
          return res.json();
        }),
        fetch('article_tags.csv').then(res => {
          if (!res.ok) throw new Error(`CSV status: ${res.status}`);
          return res.text();
        }).catch(err => {
          console.warn('CSV file fetch failed, proceeding without CSV tags:', err);
          return null;
        })
      ])
      .then(([jsonData, csvText]) => {
        const csvParsed = csvText ? parseCSV(csvText) : { headers: [], rows: [] };
        loadData(jsonData, csvParsed);
      })
      .catch(err => {
        console.error('Error loading library data:', err);
        const container = document.getElementById('articlesContainer');
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-12 text-center text-red-600 shadow-sm border border-red-100">
            <p class="text-lg font-bold">Failed to load data files</p>
            <p class="text-sm text-gray-500 mt-2">Please ensure "Urban Oceans final 2025.json" (and optionally "article_tags.csv") are located in the same folder as this HTML file.</p>
          </div>
        `;
      });
    };

    // Simple robust CSV parser
    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);
      if (lines.length === 0) return { headers: [], rows: [] };

      const parseLine = (line) => {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(cur.trim());
            cur = '';
          } else {
            cur += char;
          }
        }
        result.push(cur.trim());
        return result;
      };

      const headers = parseLine(lines[0]);
      const rows = lines.slice(1).map(parseLine);

      return { headers, rows };
    }

    // Title Normalization function to maximize fuzzy matches
    function normalizeTitle(str) {
      if (!str) return '';
      return String(str)
        .replace(/~i~/gi, '')            // remove ~i~ italic tags
        .replace(/~/g, ' ')              // convert tildes to space
        .replace(/^\d+\s*:\s*/, '')      // remove leading index numbers e.g. "1 : "
        .replace(/[^\w\s]/gi, ' ')       // remove punctuation
        .replace(/\s+/g, ' ')            // normalize whitespace
        .trim()
        .toLowerCase();
    }

    // Dice Coefficient Similarity (0 to 1) for Fuzzy Matching
    function getSimilarityRatio(s1, s2) {
      if (!s1 || !s2) return 0;
      if (s1 === s2) return 1;

      const getBigrams = (str) => {
        const bigrams = new Set();
        for (let i = 0; i < str.length - 1; i++) {
          bigrams.add(str.substring(i, i + 2));
        }
        return bigrams;
      };

      const bg1 = getBigrams(s1);
      const bg2 = getBigrams(s2);
      if (bg1.size === 0 || bg2.size === 0) return 0;

      let intersection = 0;
      bg1.forEach(b => {
        if (bg2.has(b)) intersection++;
      });

      return (2 * intersection) / (bg1.size + bg2.size);
    }

    // Custom sort comparator for tags: length first (A, B... then AA, AB...), then alphabetical
    function compareTagsLengthAlphabetical(a, b) {
      if (a.length !== b.length) {
        return a.length - b.length;
      }
      return a.localeCompare(b);
    }

    // Process CSL / Zotero JSON and integrate CSV tags
    function loadData(jsonData, csvParsed) {
      const itemsArray = Array.isArray(jsonData) ? jsonData : (jsonData.items || [jsonData]);

      // 1. Process CSV Tags Lookup Table
      const csvItems = [];
      if (csvParsed.headers && csvParsed.headers.length > 1) {
        const tagHeaders = csvParsed.headers.slice(1);

        csvParsed.rows.forEach(row => {
          if (!row[0]) return;
          const rawTitle = row[0];
          const normTitle = normalizeTitle(rawTitle);

          const activeTags = [];
          tagHeaders.forEach((tagColName, colIdx) => {
            const val = row[colIdx + 1];
            if (val === '1' || val === 1) {
              activeTags.push(tagColName);
            }
          });

          csvItems.push({
            rawTitle,
            normTitle,
            activeTags,
            matched: false
          });
        });
      }

      // 2. Map JSON items & perform fuzzy matching against CSV items
      const unmatchedJson = [];
      const tagSet = new Set();

      processedItems = itemsArray.map((item, idx) => {
        const d = item.data || item;

        if (d.itemType === 'attachment' || d.itemType === 'note') return null;

        // Title
        const title = d.title || 'Untitled';
        const normJsonTitle = normalizeTitle(title);

        // Match against CSV items
        let bestCsvMatch = null;
        let maxSimilarity = 0;

        csvItems.forEach(csvObj => {
          if (csvObj.normTitle === normJsonTitle) {
            bestCsvMatch = csvObj;
            maxSimilarity = 1.0;
            return;
          }
          const sim = getSimilarityRatio(normJsonTitle, csvObj.normTitle);
          if (sim > maxSimilarity && sim >= 0.70) {
            maxSimilarity = sim;
            bestCsvMatch = csvObj;
          }
        });

        let csvTags = [];
        if (bestCsvMatch) {
          csvTags = bestCsvMatch.activeTags;
          bestCsvMatch.matched = true;
        } else {
          unmatchedJson.push(title);
        }

        // Authors & Last Name extraction
        let authors = 'N/A';
        let firstAuthorLastName = '';
        if (Array.isArray(d.author) && d.author.length > 0) {
          authors = d.author
            .map(a => a.literal || `${a.given || ''} ${a.family || ''}`.trim())
            .filter(Boolean)
            .join(', ');
          firstAuthorLastName = (d.author[0].family || d.author[0].literal || '').toLowerCase();
        } else if (Array.isArray(d.creators) && d.creators.length > 0) {
          authors = d.creators
            .map(c => c.name || `${c.firstName || ''} ${c.lastName || ''}`.trim())
            .filter(Boolean)
            .join(', ');
          firstAuthorLastName = (d.creators[0].lastName || d.creators[0].name || '').toLowerCase();
        }

        // Publication / Journal Name
        const publication = d['container-title'] || d.publicationTitle || d.publisher || d.journalAbbreviation || '';

        // Year
        let yearNum = 0;
        let yearStr = 'N/A';
        const dateRaw = d.issued || d.date;
        if (dateRaw) {
          if (dateRaw['date-parts'] && dateRaw['date-parts'][0] && dateRaw['date-parts'][0][0]) {
            yearNum = parseInt(dateRaw['date-parts'][0][0], 10) || 0;
          } else {
            const match = String(dateRaw).match(/\b\d{4}\b/);
            if (match) yearNum = parseInt(match[0], 10);
          }
        }
        if (yearNum > 0) yearStr = String(yearNum);

        // Separate Web URL vs DOI
        let webUrl = '';
        let doiUrl = '';

        if (d.URL || d.url) {
          webUrl = d.URL || d.url;
        }
        if (d.DOI) {
          const cleanDoi = d.DOI.replace(/^https?:\/\/doi\.org\//, '');
          doiUrl = `https://doi.org/${cleanDoi}`;
        }

        // Abstract
        const abstract = d.abstract || d.abstractNote || '';

        // Item Type Display Label
        const rawType = (d.type || d.itemType || 'other').toLowerCase();
        const itemTypeDisplay = typeMapping[rawType] || 'Other';

        // Direct Tags / Keywords from JSON if present
        let jsonTags = [];
        if (typeof d.keyword === 'string' && d.keyword.trim().length > 0) {
          jsonTags = d.keyword.split(/[,;]+/).map(t => t.trim()).filter(Boolean);
        } else if (Array.isArray(d.keywords)) {
          jsonTags = d.keywords.map(k => typeof k === 'string' ? k.trim() : (k.tag || '')).filter(Boolean);
        } else if (Array.isArray(d.tags)) {
          jsonTags = d.tags.map(t => typeof t === 'string' ? t.trim() : (t.tag || '')).filter(Boolean);
        }

        // Combine Tags
        const combinedTags = Array.from(new Set([...csvTags, ...jsonTags]));
        combinedTags.forEach(t => tagSet.add(t));

        return {
          id: d.id || `item-${idx + 1}`,
          title,
          authors,
          firstAuthorLastName,
          publication,
          yearNum,
          yearStr,
          webUrl,
          doiUrl,
          abstract,
          itemTypeDisplay,
          tags: combinedTags
        };
      }).filter(Boolean);

      // Sort tags by length first (A-Z single letters, then AA, AB...) then alphabetical
      allAvailableTags = Array.from(tagSet).sort(compareTagsLengthAlphabetical);
      
      // Initially select all tags so all articles show by default
      selectedTags = new Set(allAvailableTags);

      // Collect unmatched CSV items
      const unmatchedCsv = csvItems.filter(c => !c.matched).map(c => c.rawTitle);

      renderAuditReport(unmatchedCsv, unmatchedJson);
      renderTagSidebar();
      populateYearFilter();
      expandedAbstracts.clear();
      handleFilterAndSort();
    }

    // Render Left Sidebar Tag Checkboxes
    function renderTagSidebar() {
      const container = document.getElementById('tagCheckboxesContainer');
      const searchVal = document.getElementById('tagSearchInput').value.toLowerCase().trim();
      
      container.innerHTML = '';

      const filteredTags = allAvailableTags.filter(tag => tag.toLowerCase().includes(searchVal));

      if (filteredTags.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">No matching tags found.</p>`;
        return;
      }

      filteredTags.forEach(tag => {
        const isChecked = selectedTags.has(tag);
        const labelDiv = document.createElement('label');
        labelDiv.className = "flex items-center gap-2.5 p-1.5 hover:bg-teal-50/60 rounded-lg cursor-pointer transition select-none text-xs text-gray-700";
        
        labelDiv.innerHTML = `
          <input 
            type="checkbox" 
            value="${escapeHtml(tag)}" 
            ${isChecked ? 'checked' : ''} 
            onchange="toggleTagSelection('${escapeHtml(tag, true)}', this.checked)"
            class="rounded border-gray-300 text-teal-700 focus:ring-teal-500 w-4 h-4 cursor-pointer"
          >
          <span class="truncate flex-1">${escapeHtml(tag)}</span>
        `;
        container.appendChild(labelDiv);
      });

      // Update badge count
      const badge = document.getElementById('selectedTagCountBadge');
      badge.textContent = `${selectedTags.size} of ${allAvailableTags.length} selected`;
    }

    // Toggle individual tag checkbox
    function toggleTagSelection(tag, isChecked) {
      if (isChecked) {
        selectedTags.add(tag);
      } else {
        selectedTags.delete(tag);
      }
      renderTagSidebar();
      handleFilterAndSort();
    }

    // Select All Tags
    function selectAllTags() {
      selectedTags = new Set(allAvailableTags);
      renderTagSidebar();
      handleFilterAndSort();
    }

    // Deselect All Tags
    function deselectAllTags() {
      selectedTags.clear();
      renderTagSidebar();
      handleFilterAndSort();
    }

    // Render Unmatched Audit Report at Top
    function renderAuditReport(unmatchedCsv, unmatchedJson) {
      const container = document.getElementById('auditReportContainer');
      const summaryText = document.getElementById('auditSummaryText');
      const csvCountEl = document.getElementById('unmatchedCsvCount');
      const jsonCountEl = document.getElementById('unmatchedJsonCount');
      const csvListEl = document.getElementById('unmatchedCsvList');
      const jsonListEl = document.getElementById('unmatchedJsonList');

      if (unmatchedCsv.length === 0 && unmatchedJson.length === 0) {
        container.classList.add('hidden');
        return;
      }

      container.classList.remove('hidden');
      summaryText.textContent = `Matching Audit: ${unmatchedCsv.length} CSV title(s) and ${unmatchedJson.length} JSON title(s) remained unmatched.`;
      
      csvCountEl.textContent = unmatchedCsv.length;
      jsonCountEl.textContent = unmatchedJson.length;

      csvListEl.innerHTML = unmatchedCsv.length > 0 
        ? unmatchedCsv.map(t => `<li>${escapeHtml(t)}</li>`).join('') 
        : '<li class="text-gray-400 italic">None - All CSV titles matched!</li>';

      jsonListEl.innerHTML = unmatchedJson.length > 0 
        ? unmatchedJson.map(t => `<li>${escapeHtml(t)}</li>`).join('') 
        : '<li class="text-gray-400 italic">None - All JSON titles matched!</li>';
    }

    // Populate Year Filter Dropdown
    function populateYearFilter() {
      const yearSelect = document.getElementById('yearFilter');
      const years = new Set();
      processedItems.forEach(item => {
        if (item.yearNum > 0) years.add(item.yearNum);
      });

      const sortedYears = Array.from(years).sort((a, b) => b - a);
      yearSelect.innerHTML = '<option value="ALL">All Years</option>';
      sortedYears.forEach(y => {
        const option = document.createElement('option');
        option.value = y;
        option.textContent = y;
        yearSelect.appendChild(option);
      });
    }

    // Render Filter Pills for Item Types with Counts
    function renderItemTypePills(filteredBySearchAndYear) {
      const pillsContainer = document.getElementById('itemTypePills');
      
      const counts = { 'ALL': filteredBySearchAndYear.length };
      filteredBySearchAndYear.forEach(item => {
        counts[item.itemTypeDisplay] = (counts[item.itemTypeDisplay] || 0) + 1;
      });

      const standardTypes = [
        'ALL', 'Book', 'Book Chapter', 'Conference Paper', 
        'Journal Article', 'Newspaper Article', 'Other', 'Report', 'Web Page'
      ];

      Object.keys(counts).forEach(type => {
        if (!standardTypes.includes(type)) {
          standardTypes.push(type);
        }
      });

      pillsContainer.innerHTML = '';

      standardTypes.forEach(typeKey => {
        const count = counts[typeKey] || 0;
        if (count === 0 && typeKey !== 'ALL' && selectedItemType !== typeKey) return;

        const label = typeKey === 'ALL' ? `All (${count})` : `${typeKey} (${count})`;
        const isSelected = selectedItemType === typeKey;

        const btn = document.createElement('button');
        btn.className = `px-3.5 py-1.5 rounded-full font-medium text-xs sm:text-sm transition ${
          isSelected ? 'pill-active shadow-sm' : 'pill-inactive'
        }`;
        btn.textContent = label;
        btn.onclick = () => {
          selectedItemType = typeKey;
          handleFilterAndSort();
        };
        pillsContainer.appendChild(btn);
      });
    }

    // Filter and Sort Handler
    function handleFilterAndSort() {
      const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      selectedYear = document.getElementById('yearFilter').value;

      let filtered = processedItems.filter(item => {
        const matchesSearch = 
          !searchQuery ||
          item.title.toLowerCase().includes(searchQuery) ||
          item.authors.toLowerCase().includes(searchQuery) ||
          item.abstract.toLowerCase().includes(searchQuery) ||
          item.tags.some(t => t.toLowerCase().includes(searchQuery));

        const matchesYear = 
          selectedYear === 'ALL' || 
          String(item.yearNum) === selectedYear;

        let matchesTags = true;
        if (selectedTags.size === 0) {
          matchesTags = false;
        } else {
          matchesTags = item.tags.some(t => selectedTags.has(t));
        }

        return matchesSearch && matchesYear && matchesTags;
      });

      renderItemTypePills(filtered);

      if (selectedItemType !== 'ALL') {
        filtered = filtered.filter(item => item.itemTypeDisplay === selectedItemType);
      }

      filtered.sort((a, b) => {
        if (currentSort === 'title') {
          return a.title.localeCompare(b.title);
        } else if (currentSort === 'year') {
          return b.yearNum - a.yearNum || a.title.localeCompare(b.title);
        } else if (currentSort === 'author') {
          return a.firstAuthorLastName.localeCompare(b.firstAuthorLastName) || a.title.localeCompare(b.title);
        }
        return 0;
      });

      renderArticles(filtered);
    }

    // Render Article Cards
    function renderArticles(items) {
      const container = document.getElementById('articlesContainer');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-12 text-center text-gray-500 shadow-sm border border-gray-100">
            <p class="text-lg font-medium">No matching research articles found.</p>
            <p class="text-sm text-gray-400 mt-1">Try adjusting your search query, year, type, or tag filters.</p>
          </div>
        `;
        return;
      }

      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-gray-100/80 flex flex-col sm:flex-row items-start gap-4 sm:gap-8 transition hover:shadow-md";

        const displayIndex = String(index + 1).padStart(3, '0');
        const isAbstractExpanded = expandedAbstracts.has(item.id);

        card.innerHTML = `
          <!-- Left Index Number -->
          <div class="text-index-teal font-bold text-lg sm:text-xl min-w-[45px] pt-0.5">
            ${displayIndex}
          </div>

          <!-- Content Body -->
          <div class="flex-1 min-w-0">
            <!-- Article Title -->
            <h2 class="text-title-teal text-xl font-bold leading-snug mb-1">
              ${escapeHtml(item.title)}
            </h2>

            <!-- Author(s) -->
            <div class="text-gray-600 font-normal text-base mb-1">
              ${escapeHtml(item.authors)}
            </div>

            <!-- Journal / Publication and Year -->
            <div class="text-gray-500 text-sm italic mb-3">
              ${item.publication ? `${escapeHtml(item.publication)} | ` : ''}${item.yearStr}
            </div>

            <!-- Link and DOI Buttons -->
            ${(item.webUrl || item.doiUrl) ? `
              <div class="flex items-center gap-2 mb-3">
                ${item.webUrl ? `
                  <a 
                    href="${escapeHtml(item.webUrl)}" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    class="inline-block bg-[#0f3842] hover:bg-[#002730] text-white text-xs font-semibold px-3 py-1 rounded transition shadow-sm"
                  >
                    Link
                  </a>
                ` : ''}
                ${item.doiUrl ? `
                  <a 
                    href="${escapeHtml(item.doiUrl)}" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    class="inline-block bg-[#0f3842] hover:bg-[#002730] text-white text-xs font-semibold px-3 py-1 rounded transition shadow-sm"
                  >
                    DOI
                  </a>
                ` : ''}
              </div>
            ` : ''}

            <!-- Abstract Dropdown Toggle -->
            ${item.abstract ? `
              <div class="mb-3">
                <button 
                  onclick="toggleAbstract('${item.id}')" 
                  class="text-teal-700 hover:text-teal-900 font-semibold text-sm flex items-center gap-1 focus:outline-none"
                >
                  <span class="text-xs">${isAbstractExpanded ? '▲' : '▼'}</span> Abstract
                </button>
                ${isAbstractExpanded ? `
                  <div class="mt-2 p-4 bg-slate-50 border border-slate-200/80 rounded-xl text-gray-700 text-sm leading-relaxed">
                    ${escapeHtml(item.abstract)}
                  </div>
                ` : ''}
              </div>
            ` : ''}

            <!-- Tags / Keywords Badges -->
            ${item.tags.length > 0 ? `
              <div class="mt-3 flex flex-wrap gap-1">
                ${item.tags.map(tag => `<span class="tag-badge">${escapeHtml(tag)}</span>`).join('')}
              </div>
            ` : ''}

          </div>
        `;

        container.appendChild(card);
      });
    }

    // Toggle Abstract Visibility
    function toggleAbstract(itemId) {
      if (expandedAbstracts.has(itemId)) {
        expandedAbstracts.delete(itemId);
      } else {
        expandedAbstracts.add(itemId);
      }
      handleFilterAndSort();
    }

    // Set Active Sort Method
    function setSort(sortType) {
      currentSort = sortType;

      const btnTitle = document.getElementById('sortTitle');
      const btnYear = document.getElementById('sortYear');
      const btnAuthor = document.getElementById('sortAuthor');

      btnTitle.className = `px-4 py-1.5 rounded-full font-medium transition ${sortType === 'title' ? 'pill-active shadow-sm' : 'pill-inactive'}`;
      btnYear.className = `px-4 py-1.5 rounded-full font-medium transition ${sortType === 'year' ? 'pill-active shadow-sm' : 'pill-inactive'}`;
      btnAuthor.className = `px-4 py-1.5 rounded-full font-medium transition ${sortType === 'author' ? 'pill-active shadow-sm' : 'pill-inactive'}`;

      handleFilterAndSort();
    }

    // Security Helper
    function escapeHtml(str, isAttr = false) {
      if (!str) return '';
      const safe = String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
      return isAttr ? safe.replace(/"/g, '&quot;').replace(/'/g, "&#039;") : safe;
    }
  </script>
</body>
</html>
