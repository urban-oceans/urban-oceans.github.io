<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metro Vancouver Urban Oceans Literature Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f3f7f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Primary palette matching design */
    .bg-header {
      background-color: #00667e;
    }
    .text-title-teal {
      color: #0c4a5c;
    }
    .text-index-teal {
      color: #0a6b7d;
    }
    .border-pill-teal {
      border-color: #007a93;
    }
    
    /* Pill button active state */
    .pill-active {
      background-color: #0f3842;
      color: #ffffff;
    }
    .pill-inactive {
      background-color: #e0f2f1;
      color: #0f3842;
    }
    .pill-inactive:hover {
      background-color: #ccece9;
    }

    /* Tag badge styling */
    .tag-badge {
      background-color: #e0f2f1;
      color: #0b5061;
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-right: 6px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    /* Custom focus states */
    input:focus, select:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 102, 126, 0.25);
    }
  </style>
</head>

  <header class="bg-header text-white py-8 px-4 text-center shadow-md relative">
    <div class="max-w-6xl mx-auto flex flex-col items-center justify-center">
      <div class="flex items-center gap-3 mb-1">
        <!-- Wave Logo Icon -->
        <span class="text-4xl leading-none select-none">🌊</span>
        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">Urban Oceans Library</h1>
      </div>
      <p class="text-teal-100 text-sm sm:text-base font-normal">Metro Vancouver Urban Oceans Literature Library</p>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">

              ⚠️ <span id="auditSummaryText">Matching Report: Unmatched Items Found</span>
